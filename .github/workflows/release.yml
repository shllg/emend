# Releases shipped changes from main nightly or on demand. Builds without write credentials;
# only the publish job can request npm's trusted-publishing identity. Main gets no release commits;
# the release branch gets one stamp commit per release.
name: Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor]
        default: auto
      dry_run:
        description: Verify and pack without tagging or publishing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && github.repository == 'shllg/emend' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      resume: ${{ steps.plan.outputs.resume }}
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history includes origin/release, needed to detect unfinished releases.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - id: plan
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: node scripts/release.ts plan --bump "$BUMP" --notes "$RUNNER_TEMP/notes.md"

      - run: node scripts/release.ts manifests "$VERSION" "$SHA" "$RUNNER_TEMP/manifests"
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ steps.plan.outputs.sha }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-manifests
          path: ${{ runner.temp }}/manifests
          if-no-files-found: error
          overwrite: true

      - name: Release summary
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          VERSION: ${{ steps.plan.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$RELEASE" != true ]; then
            echo "No shipped changes to release." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ "$DRY_RUN" = true ]; then
              echo "Dry run: would release emend $VERSION." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Planned release: emend $VERSION." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error
          overwrite: true

  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      sync-base: ${{ needs.plan.outputs.previous }}

  build:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.ts stamp "$VERSION"
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - run: pnpm build
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
        working-directory: apps/emend

      - id: pack
        name: Check and fingerprint the packed tarball
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP/pack/"*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] || { echo "Expected one tarball" >&2; exit 1; }
          tarball="${tarballs[0]}"
          node scripts/check-package.ts --tarball "$tarball"
          integrity=$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; console.log("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"));' "$tarball")
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$tarball")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          overwrite: true

  tag:
    needs: [plan, build]
    if: ${{ !inputs.dry_run && vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if ! release_sha=$(gh api "repos/$GH_REPO/git/ref/heads/release" --jq .object.sha); then
            echo "could not resolve the release branch" >&2
            exit 1
          fi
          if ! plugin=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$GH_REPO/contents/plugin/.claude-plugin/plugin.json?ref=$release_sha"); then
            echo "could not read plugin/.claude-plugin/plugin.json at $release_sha" >&2
            exit 1
          fi
          if ! release_version=$(jq -r 'if has("version") then (.version | select(type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\z"))) // error("invalid version") else "" end' <<< "$plugin"); then
            echo "invalid plugin/.claude-plugin/plugin.json at $release_sha" >&2
            exit 1
          fi
          source_sha="$release_sha"
          if [ -n "$release_version" ]; then
            if ! source_sha=$(gh api "repos/$GH_REPO/git/commits/$release_sha" --jq '.parents[0].sha'); then
              echo "could not resolve the release source at $release_sha" >&2
              exit 1
            fi
            [ -n "$source_sha" ] && [ "$source_sha" != null ] || { echo "release stamp has no first parent" >&2; exit 1; }
          fi
          if ! comparison=$(gh api "repos/$GH_REPO/compare/$source_sha...$SHA" --jq .status); then
            echo "could not compare release with $SHA" >&2
            exit 1
          fi
          if [ "$comparison" != ahead ] && [ "$comparison" != identical ]; then
            echo "release is ahead of or diverged from $SHA; refusing a stale run" >&2
            exit 1
          fi
          if object=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq '.object | [.type, .sha] | @tsv' 2> "$RUNNER_TEMP/tag-error"); then
            read -r type current <<< "$object"
            while [ "$type" = tag ]; do
              object=$(gh api "repos/$GH_REPO/git/tags/$current" --jq '.object | [.type, .sha] | @tsv')
              read -r type current <<< "$object"
            done
            [ "$type" = commit ] && [ "$current" = "$SHA" ] || { echo "Tag v$VERSION points at another commit" >&2; exit 1; }
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/tag-error"; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$SHA"
          else
            cat "$RUNNER_TEMP/tag-error" >&2
            exit 1
          fi

  publish:
    needs: [plan, build, tag]
    if: ${{ !inputs.dry_run && vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
          path: ${{ runner.temp }}/pack

      - name: Publish the verified tarball through npm trusted publishing
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RESUME: ${{ needs.plan.outputs.resume }}
          SHA: ${{ needs.plan.outputs.sha }}
          FILENAME: ${{ needs.build.outputs.filename }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          tarball="$RUNNER_TEMP/pack/$FILENAME"
          actual=$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; console.log("sha512-" + createHash("sha512").update(readFileSync(process.argv[1])).digest("base64"));' "$tarball")
          [ "$actual" = "$INTEGRITY" ] || { echo "Tarball integrity mismatch" >&2; exit 1; }
          npm_version=$(npm --version)
          node --input-type=module -e 'const v = process.argv[1]; const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(v); if (!m || !(+m[1] > 11 || (+m[1] === 11 && (+m[2] > 5 || (+m[2] === 5 && +m[3] >= 1))))) { console.error("npm >= 11.5.1 is required"); process.exit(1); }' "$npm_version"
          if existing=$(npm view "@shllg/emend@$VERSION" dist.integrity 2> "$RUNNER_TEMP/npm-error"); then
            [ -n "$existing" ] || { echo "npm returned empty integrity for $VERSION" >&2; exit 1; }
            if [ "$existing" = "$INTEGRITY" ]; then
              echo "Matching package is already published."
            elif [ "$RESUME" = true ]; then
              echo "Version already published from an earlier build; skipping."
            else
              echo "npm has $VERSION from a build this run did not make" >&2
              exit 1
            fi
          elif grep -q 'E404' "$RUNNER_TEMP/npm-error"; then
            [ "$GITHUB_SHA" = "$SHA" ] || { echo "npm provenance requires the run commit $GITHUB_SHA to match the planned commit $SHA" >&2; exit 1; }
            npm publish --ignore-scripts --access public "$tarball"
          else
            cat "$RUNNER_TEMP/npm-error" >&2
            exit 1
          fi

      - name: Wait for npm visibility before updating the marketplace
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            visible=$(timeout "${remaining}s" npm view "@shllg/emend@$VERSION" version 2>/dev/null) || visible=""
            if [ "$visible" = "$VERSION" ]; then
              exit 0
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then break; fi
            if (( remaining < 20 )); then sleep "$remaining"; else sleep 20; fi
          done
          echo "npm did not expose $VERSION within 15 minutes; re-run failed jobs." >&2
          exit 1

  mark:
    needs: [plan, publish]
    if: ${{ !inputs.dry_run && vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if gh api "repos/$GH_REPO/releases/tags/v$VERSION" > /dev/null 2> "$RUNNER_TEMP/release-error"; then
            echo "Release v$VERSION already exists."
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/release-error"; then
            gh release create "v$VERSION" --title "emend $VERSION" --notes-file "$RUNNER_TEMP/notes/notes.md" --verify-tag
          else
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-manifests
          path: ${{ runner.temp }}/manifests

      - name: Stamp and move the marketplace branch without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          for path in plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            if ! original=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$GH_REPO/contents/$path?ref=$SHA"); then
              echo "could not read $path at $SHA" >&2
              exit 1
            fi
            if ! jq -n -e --rawfile raw "$RUNNER_TEMP/manifests/${path##*/}" --argjson original "$original" --arg version "$VERSION" '($original | has("version") | not) and (($raw | fromjson) == ($original + {version: $version}))'; then
              echo "stamped manifest does not match $path at $SHA with version $VERSION" >&2
              exit 1
            fi
          done

          parents=$(jq -n --arg sha "$SHA" '[$sha]')
          if release_sha=$(gh api "repos/$GH_REPO/git/ref/heads/release" --jq .object.sha 2> "$RUNNER_TEMP/branch-error"); then
            if ! plugin=$(gh api -H "Accept: application/vnd.github.raw+json" "repos/$GH_REPO/contents/plugin/.claude-plugin/plugin.json?ref=$release_sha"); then
              echo "could not read plugin/.claude-plugin/plugin.json at $release_sha" >&2
              exit 1
            fi
            if ! release_version=$(jq -r 'if has("version") then (.version | select(type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\z"))) // error("invalid version") else "" end' <<< "$plugin"); then
              echo "invalid plugin/.claude-plugin/plugin.json at $release_sha" >&2
              exit 1
            fi
            source_sha="$release_sha"
            if [ -n "$release_version" ]; then
              if ! source_sha=$(gh api "repos/$GH_REPO/git/commits/$release_sha" --jq '.parents[0].sha'); then
                echo "could not resolve the release source at $release_sha" >&2
                exit 1
              fi
              [ -n "$source_sha" ] && [ "$source_sha" != null ] || { echo "release stamp has no first parent" >&2; exit 1; }
              parents=$(jq -n --arg sha "$SHA" --arg released "$release_sha" '[$sha, $released]')
            fi
            if [ "$source_sha" = "$SHA" ] && [ "$release_version" = "$VERSION" ]; then
              echo "release already carries $VERSION"
              exit 0
            fi
            if [ -n "$release_version" ]; then
              if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
                [ "$VERSION" = "$release_version" ] ||
                [ "$(printf '%s\n' "$release_version" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
                echo "release already carries $release_version; refusing $VERSION" >&2
                exit 1
              fi
            fi
            if ! comparison=$(gh api "repos/$GH_REPO/compare/$source_sha...$SHA" --jq .status); then
              echo "could not compare release with $SHA" >&2
              exit 1
            fi
            if [ "$comparison" != ahead ] && [ "$comparison" != identical ]; then
              echo "release is ahead of or diverged from $SHA; refusing a stale run" >&2
              exit 1
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/branch-error"; then
            release_sha=""
          else
            cat "$RUNNER_TEMP/branch-error" >&2
            exit 1
          fi

          if ! base_tree=$(gh api "repos/$GH_REPO/git/commits/$SHA" --jq .tree.sha); then
            echo "could not resolve the tree at $SHA" >&2
            exit 1
          fi
          if ! tree=$(jq -n --arg base_tree "$base_tree" \
            --rawfile plugin "$RUNNER_TEMP/manifests/plugin.json" \
            --rawfile marketplace "$RUNNER_TEMP/manifests/marketplace.json" \
            '{base_tree: $base_tree, tree: [
              {path: "plugin/.claude-plugin/plugin.json", mode: "100644", type: "blob", content: $plugin},
              {path: ".claude-plugin/marketplace.json", mode: "100644", type: "blob", content: $marketplace}
            ]}' | gh api --method POST "repos/$GH_REPO/git/trees" --input - --jq .sha); then
            echo "could not create the stamped tree" >&2
            exit 1
          fi
          if ! stamp=$(jq -n --arg message "chore: stamp emend $VERSION into the plugin manifests" \
            --arg tree "$tree" --argjson parents "$parents" \
            '{message: $message, tree: $tree, parents: $parents}' \
            | gh api --method POST "repos/$GH_REPO/git/commits" --input - --jq .sha); then
            echo "could not create the stamp commit" >&2
            exit 1
          fi
          echo "Stamp commit: $stamp"
          if [ -n "$release_sha" ]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/heads/release" -f "sha=$stamp" -F force=false
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/release -f "sha=$stamp"
          fi
