# Runs the pnpm verify checks in parallel on every push to main and every pull request into main.
# Read-only token, no secrets.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # A push checks the commits it brought; a pull request checks the whole branch.
      sync-base: ${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref) }}
